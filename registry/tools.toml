[tools.betterleaks]
name = "Betterleaks"
repo = "betterleaks/betterleaks"
category = "Secrets"
stacks = []
rationale = "finds committed secrets in files, git history and pull requests, with optional live validation of credentials. Reads Gitleaks-style TOML rules."
limitations = "created February 2026; the stable line is v1.9.0 while v2 is in release-candidate, so pin the version; recall claims are the project's own; TruffleHog (AGPL-3.0) and Kingfisher (Apache-2.0) are the alternatives. Verified in alpha: `dir` scans the working tree, not git history, so it works before the first commit. Exit 1 on leaks (`--exit-code` changes it). Ignore file: `.betterleaksignore` in the scan root, one fingerprint per line in the form `path:rule-id:line` (for example `a.py:github-pat:3`); `--verbose --legacy-print` shows each finding's fingerprint. Config: `.betterleaks.toml`, loaded only with `--unsafe-auto-load-config` or `--config`. `dir` scans gitignored files too (`.env`, `.venv`, `node_modules`), so alpha's config extends the default rules (`[extend] useDefault = true`) with an `[[allowlists]]` of path regexes. With the default re2 engine, a path regex never matches through a `(?:$|/)` group: `\\.env(?:$|/)` misses `.env`, while `\\.env$` matches it. Detection skips well-known example keys such as AKIAIOSFODNN7EXAMPLE."
last_reviewed = 2026-11-10
[tools.betterleaks.pin]
mise = "github:betterleaks/betterleaks"
version = "1.10.0"
command = "betterleaks dir . --no-banner --no-color"
fails_with = 1

