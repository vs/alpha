# Source: dev-quality-gates 829848c (CC0)
# Tools alpha can recommend or generate. `pin` is set where alpha writes the tool into a
# project's mise.toml: verified by installing `mise` spec@version and running `command`
# in a scratch folder, once on clean input (exit 0) and once on a violation (`fails_with`).

[tools.jactionlint]
name = "jactionlint"
repo = "jdx/jactionlint"
category = "GitHub Actions"
stacks = []
rationale = "lints GitHub Actions workflows, composite actions and `dependabot.yml` for correctness, security and policy in one binary. `--fix` repairs what has a mechanical fix; with `--online` it also pins tags to commit SHAs."
limitations = "created in October 2026 and run by one maintainer; parity with zizmor is self-reported. If you need an established second implementation, offline archived-action detection, pre-commit config audits or an LSP, add [zizmor](https://github.com/zizmorcore/zizmor). Verified in alpha: alpha runs it from the project root with no arguments: it needs a git repository and exits 3 without one, 1 on findings. Its default profile is strict: every workflow needs top-level `concurrency:` and `permissions:`, `timeout-minutes` on each job, `persist-credentials: false` on checkout and every `uses` pinned to a full SHA. It prints a note and skips shell checks when shellcheck isn't installed. By default (`generated-files: skip-policy`) it skips the policy and style rules, SHA pinning and timeouts included, in a file whose first comment says a tool wrote it, such as `# Generated by alpha`, so generated projects set `generated-files: report` in `.github/jactionlint.yaml`."
last_reviewed = 2026-11-09
[tools.jactionlint.pin]
mise = "jactionlint"
version = "2.5.0"
command = "jactionlint"
fails_with = 1

[tools.jactionlint.pin.baseline]
command = "jactionlint"
pattern = '^(?P<file>[^:\s]+):\d+:\d+: .*\[(?P<rule>[a-z0-9-]+)\]$'

