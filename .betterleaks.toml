# Generated by alpha: betterleaks settings. The default rules, minus the files
# git ignores (local secrets belong in .env files) and the lockfiles. paths
# holds regular expressions, searched for in each file's path.

[extend]
useDefault = true

[[allowlists]]
description = "Files git ignores, and lockfiles"
paths = ["(?:^|/)\\.superpowers/", "(?:^|/)\\.claude/alpha/state/", "(?:^|/)\\.claude/settings\\.local\\.json$", "(?:^|/)\\.claude/settings\\.local\\.json/", "(?:^|/)\\.claude/worktrees/", "(?:^|/)\\.DS_Store$", "(?:^|/)\\.DS_Store/", "(?:^|/)\\.claude/alpha/hooks/__pycache__/", "(?:^|/)\\.env$", "(?:^|/)\\.env/", "(?:^|/)\\.env\\.(?:|e(?:|x(?:|a(?:|m(?:|p(?:|l(?:|e(?:[^/][^/]*)|[^/e][^/]*)|[^/l][^/]*)|[^/p][^/]*)|[^/m][^/]*)|[^/a][^/]*)|[^/x][^/]*)|[^/e][^/]*)$", "(?:^|/)\\.env\\.(?:|e(?:|x(?:|a(?:|m(?:|p(?:|l(?:|e(?:[^/][^/]*)|[^/e][^/]*)|[^/l][^/]*)|[^/p][^/]*)|[^/m][^/]*)|[^/a][^/]*)|[^/x][^/]*)|[^/e][^/]*)/", "(?:^|/)(?:.*/)?\\.env$", "(?:^|/)(?:.*/)?\\.env/", "(?:^|/)(?:.*/)?\\.env\\.(?:|e(?:|x(?:|a(?:|m(?:|p(?:|l(?:|e(?:[^/][^/]*)|[^/e][^/]*)|[^/l][^/]*)|[^/p][^/]*)|[^/m][^/]*)|[^/a][^/]*)|[^/x][^/]*)|[^/e][^/]*)$", "(?:^|/)(?:.*/)?\\.env\\.(?:|e(?:|x(?:|a(?:|m(?:|p(?:|l(?:|e(?:[^/][^/]*)|[^/e][^/]*)|[^/l][^/]*)|[^/p][^/]*)|[^/m][^/]*)|[^/a][^/]*)|[^/x][^/]*)|[^/e][^/]*)/", "(?:^|/)\\.venv/", "(?:^|/)__pycache__/", "(?:^|/)\\.pytest_cache/", "(?:^|/)coverage\\.xml$", "(?:^|/)coverage\\.xml/", "(?:^|/)\\.coverage$", "(?:^|/)\\.coverage/", "(?:^|/)uv\\.lock$", "(?:^|/)uv\\.lock/"]
