# The kit's own checks: the same docs and agent-config gates it generates.
# `mise install` fetches the tools, `mise run check` runs everything.
# Generated by alpha: the repository checks' tools and tasks.
# `mise run ci` runs the repository checks, `mise run check` adds each
# component's checks, `mise run scheduled` runs the weekly scans, and
# `mise run check:toolchain` looks for newer releases of the pinned tools.
# `mise run --continue-on-error <task>` reports every failing check, not
# only the first.

[settings]

[settings.task]
run_auto_install = false  # don't install missing tools of the global config

[tools]
"github:betterleaks/betterleaks" = "1.10.0"
osv-scanner = "2.7.0"
typos = "1.52.0"
rumdl = "0.3.2"
lychee = "0.24.2"
"github:agent-sh/agnix" = "0.61.0"

[tasks]

[tasks."check:typos"]
description = "Spell-check docs and code"
run = "typos"

[tasks."check:rumdl"]
description = "Lint Markdown"
run = "rumdl check ."

[tasks."check:agnix"]
description = "Lint skills and agent config"
run = "agnix --strict"

[tasks."check:python"]
description = "Tests, lint, format and types"
run = [
  "uv run pytest",
  "uv run ruff check src tests project-files",
  "uv run ruff format --check src tests project-files",
  "uv run pyright",
]

[tasks."check:secrets"]
run = "betterleaks dir . --no-banner --no-color --config .betterleaks.toml"

[tasks."check:vulns"]
run = "osv-scanner scan source -r ."

[tasks."check:markdown"]
run = "rumdl check ."

[tasks."check:links"]
run = "lychee --offline --no-progress ."

[tasks."check:links-online"]
run = "lychee --no-progress ."

[tasks."check:agent-config"]
run = "agnix --strict"

[tasks."check:shortcuts"]
run = "python3 .claude/alpha/checks/shortcuts.py"

[tasks."check:review-dates"]
run = "python3 .claude/alpha/checks/review_dates.py"

[tasks."check:toolchain"]
run = "mise outdated --no-global --bump --json | python3 -c \"import json,sys; d=json.load(sys.stdin); print(json.dumps(d, indent=2)); d and print('Pinned tools have newer releases: run mise upgrade --bump --no-global and commit mise.toml (then rerun the checks)'); sys.exit(1 if d else 0)\""

[tasks."check:component:alpha"]
dir = "."
run = ["uv sync", "uv run ruff format --check src tests project-files", "uv run ruff check src tests project-files", "uv run pyright", "uv run pytest"]

[tasks.ci]
description = "Run the repository checks"
depends = ["check:secrets", "check:vulns", "check:typos", "check:markdown", "check:links", "check:agent-config", "check:shortcuts", "check:review-dates"]

[tasks.scheduled]
description = "Run the weekly scans"
depends = ["check:vulns", "check:links-online", "check:review-dates"]

# check:rumdl, check:agnix and check:python stay as shortcuts; ci and
# check:component:alpha run the same tools, so check doesn't run them twice.
[tasks.check]
description = "Every check the kit runs on itself"
depends = ["ci", "check:component:alpha"]
