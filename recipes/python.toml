stack = "python"
proven = true
bootstrap = ["uv add --dev pytest pytest-cov ruff pyright deptry"]
lockfiles = ["uv.lock"]
ignores = [".venv/", "__pycache__/", ".pytest_cache/", "coverage.xml", ".coverage"]
coverage = "uv run pytest --cov --cov-report=xml:coverage.xml"
coverage_report = "coverage.xml"
dependabot = "uv"
manifests = ["pyproject.toml"]
source_globs = ["**/*.py"]
test_globs = ["tests/**/*.py", "**/test_*.py", "**/*_test.py", "**/conftest.py"]
exclude_globs = ["**/.*/**", "**/__pycache__/**", "**/build/**", "**/dist/**"]
allow = ["Bash(uv run:*)", "Bash(uv sync:*)", "Bash(uv add:*)"]

[commands]
setup = "uv sync"
test = "uv run pytest"
lint = "uv run ruff check"
format = "uv run ruff format"
format_check = "uv run ruff format --check"
typecheck = "uv run pyright"
structure = "uv run deptry ."
format_file = "uv run ruff format {file}"
lint_file = "uv run ruff check {file}"

[files]
"pyproject.toml" = "pyproject.toml.tmpl"
"tests/test_setup.py" = "test_setup.py.tmpl"
".python-version" = "python-version.tmpl"

[why]
pytest = "Test runner"
pytest-cov = "Coverage of the lines a pull request changes"
ruff = "Linting and formatting"
pyright = "Strict type checking"
deptry = "Unused, missing and transitive dependencies"

[ci]
env = { UV_LOCKED = "1" }  # uv fails instead of updating a stale uv.lock

# Pinned to a commit SHA, as registry/actions.toml has it; `version` is the tag.
[[ci.steps]]
uses = "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2"
version = "v10.3.3"
with = { enable-cache = true, cache-dependency-glob = "${dir}uv.lock" }

[[rules]]
id = "uv-for-dependencies"
rule = "Add and remove dependencies with `uv add` and `uv remove`, never by editing the dependency lists in `pyproject.toml` or with `pip`."

[[rules]]
id = "typed-boundaries"
rule = "Parse external input (JSON, files, environment, requests) into dataclasses or typed models at the boundary; don't pass `dict[str, Any]` inward."

[[rules]]
id = "import-contracts"
rule = "Once a component has more than one package, add import-linter contracts for the layers `docs/architecture.md` names, and add `lint-imports` to its `structure` command."
