stack = "python"
proven = true
bootstrap = ["uv add --dev pytest pytest-cov ruff pyright deptry"]
lockfiles = ["uv.lock"]
ignores = [".venv/", "__pycache__/", ".pytest_cache/", "coverage.xml", ".coverage"]
# --cov-branch records each branch's two sides, which the diff coverage check
# of a project with exhaustive testing reads.
coverage = "uv run pytest --cov --cov-branch --cov-report=xml:coverage.xml"
coverage_report = "coverage.xml"
dependabot = "uv"
manifests = ["pyproject.toml"]
source_globs = ["**/*.py"]
test_globs = ["tests/**/*.py", "**/test_*.py", "**/*_test.py", "**/conftest.py"]
exclude_globs = ["**/.*/**", "**/__pycache__/**", "**/build/**", "**/dist/**"]
allow = ["Bash(uv run:*)", "Bash(uv sync:*)", "Bash(uv add:*)"]

# The files whose folder `alpha adopt survey` lists as a candidate component.
[detect]
markers = ["pyproject.toml", "setup.py", "setup.cfg", "requirements.txt", "Pipfile"]

[commands]
setup = "uv sync"
test = "uv run pytest"
lint = "uv run ruff check"
format = "uv run ruff format"
format_check = "uv run ruff format --check"
typecheck = "uv run pyright"
structure = "uv run deptry ."
format_file = "uv run ruff format {file}"
lint_file = "uv run ruff check {file}"

# How each check's findings read, for an adopted project's baselines (spec
# §8b). Matched against output recorded from the pinned tools; see
# tests/fixtures/baseline-output/.
[baseline.lint]
command = "uv run ruff check --output-format concise"
pattern = '^(?P<file>[^:\s]+):\d+:\d+: (?P<rule>[A-Za-z][A-Za-z0-9-]*)[: ]'
file_command = "uv run ruff check --output-format concise {file}"

# Pyright's text output wraps long messages onto the next line, rule included.
[baseline.typecheck]
command = "uv run pyright --outputjson"
json = { items = "generalDiagnostics.*", file = "file", rule = "rule", where = { severity = "error" } }

[baseline.structure]
command = "uv run deptry ."
pattern = '^(?P<file>[^:\s]+)(?::\d+:\d+)?: (?P<rule>DEP\d+) '

[baseline.test]
command = "uv run pytest -rfE"
pattern = '^(?:FAILED|ERROR) (?P<file>[^:\s]+)(?:::(?P<rule>\S+))?'

# An adopted repo keeps its own tool configs, which don't exclude alpha's
# folder the way this recipe's pyproject.toml does. These commands replace the
# ones above in an adopted recipe that extends this one (pyright and pytest
# skip dot-folders already).
[adopt.commands]
lint = "uv run ruff check --extend-exclude .claude"
format = "uv run ruff format --extend-exclude .claude"
format_check = "uv run ruff format --check --extend-exclude .claude"
structure = "uv run deptry . --extend-exclude .claude"

[adopt.baseline.lint]
command = "uv run ruff check --output-format concise --extend-exclude .claude"

[adopt.baseline.structure]
command = "uv run deptry . --extend-exclude .claude"

[files]
"pyproject.toml" = "pyproject.toml.tmpl"
"tests/test_setup.py" = "test_setup.py.tmpl"
".python-version" = "python-version.tmpl"

[why]
pytest = "Test runner"
pytest-cov = "Coverage of the lines a pull request changes"
ruff = "Linting and formatting"
pyright = "Strict type checking"
deptry = "Unused, missing and transitive dependencies"

[ci]
env = { UV_LOCKED = "1" }  # uv fails instead of updating a stale uv.lock

# Pinned to a commit SHA, as registry/actions.toml has it; `version` is the tag.
[[ci.steps]]
uses = "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2"
version = "v10.3.3"
with = { enable-cache = true, cache-dependency-glob = "${dir}uv.lock" }

[[rules]]
id = "uv-for-dependencies"
rule = "Add and remove dependencies with `uv add` and `uv remove`, never by editing the dependency lists in `pyproject.toml` or with `pip`."

[[rules]]
id = "typed-boundaries"
rule = "Parse external input (JSON, files, environment, requests) into dataclasses or typed models at the boundary; don't pass `dict[str, Any]` inward."

[[rules]]
id = "import-contracts"
rule = "Once a component has more than one package, add import-linter contracts for the layers `docs/architecture.md` names, and add `lint-imports` to its `structure` command."
