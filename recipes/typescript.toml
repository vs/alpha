stack = "typescript"
proven = true  # the kit's own, run in real projects
bootstrap = [
  "pnpm add -D typescript vitest @biomejs/biome @types/node",
  # CI's pnpm/action-setup installs the version recorded here.
  "pnpm pkg set packageManager=pnpm@$(pnpm --version)",
]
lockfiles = ["pnpm-lock.yaml"]
ignores = ["node_modules/", "dist/", "coverage/"]
dependabot = "npm"  # Dependabot package-ecosystem; covers pnpm
manifests = ["package.json"]
# Source is every .ts/.tsx file in the component, minus tests and excluded files.
source_globs = ["**/*.ts", "**/*.tsx"]
test_globs = ["tests/**/*.ts", "tests/**/*.tsx", "**/*.test.ts", "**/*.test.tsx"]
# Dot-dirs, generated or vendored code, and tool config files.
exclude_globs = [
  "**/.*/**",
  "**/node_modules/**",
  "**/dist/**",
  "**/build/**",
  "**/coverage/**",
  "**/*.config.ts",
  "**/*.config.mts",
]
allow = [
  "Bash(pnpm vitest:*)",
  "Bash(pnpm biome:*)",
  "Bash(pnpm tsc:*)",
  "Bash(pnpm install:*)",
  "Bash(pnpm add:*)",
]

[commands]
setup = "pnpm install"
test = "pnpm vitest run"
lint = "pnpm biome lint --error-on-warnings ."
format = "pnpm biome format --write ."
format_check = "pnpm biome format ."
typecheck = "pnpm tsc --noEmit"
format_file = "pnpm biome format --write {file}"
lint_file = "pnpm biome lint --error-on-warnings {file}"

[files]
"package.json" = "package.json.tmpl"
"tsconfig.json" = "tsconfig.json.tmpl"
"biome.json" = "biome.json.tmpl"
"tests/setup.test.ts" = "setup.test.ts.tmpl"
".node-version" = "node-version.tmpl"

# The dev tools bootstrap installs, with the reason the dependency log gives.
[why]
typescript = "Type checking and compilation"
vitest = "Test runner"
"@biomejs/biome" = "Linting and formatting"
"@types/node" = "Node.js type definitions"

[ci]
env = {}

[[ci.steps]]
uses = "pnpm/action-setup@v6"
with = { package_json_file = "${dir}package.json" }

[[ci.steps]]
uses = "actions/setup-node@v7"
with = { node-version-file = "${dir}.node-version", cache = "pnpm", cache-dependency-path = "${dir}pnpm-lock.yaml" }

# Rules for code on this stack that no tool here checks; the Biome and
# tsconfig settings cover the rest.
[[rules]]
id = "top-level-imports"
rule = "Import at the top of the file only: no `await import()` and no `import(\"pkg\").Type` in types."

[[rules]]
id = "unknown-at-boundaries"
rule = "External data (JSON, request bodies, environment) enters as `unknown` and is narrowed by a schema or a type guard, never by `as`."

[[rules]]
id = "pnpm-for-dependencies"
rule = "Add and remove dependencies with `pnpm add` and `pnpm remove`, and don't approve a dependency's install scripts (`pnpm approve-builds`) without asking the user."
