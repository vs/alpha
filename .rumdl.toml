# rumdl settings. `rumdl fmt .` fixes most findings.
# MD013: the kit's docs are one line per paragraph or list item, so editing a
# sentence never means rewrapping its paragraph. Headings and code blocks keep
# the 80-column limit.
[global]
exclude = [
  ".superpowers",      # git-ignored session scratch
  ".claude/worktrees", # other sessions' checkouts
  ".venv",
  "uv.lock",
  # alpha's generated excludes
  ".claude/alpha/state/",
  ".claude/alpha/notes/",
  ".claude/settings.local.json",
  ".claude/worktrees/",
  ".DS_Store",
  ".claude/alpha/hooks/__pycache__/",
  ".claude/alpha/checks/__pycache__/",
  ".env",
  ".env.*",
  "**/.env",
  "**/.env.*",
  ".venv/",
  "__pycache__/",
  ".pytest_cache/",
  "coverage.xml",
  ".coverage",
]

[MD013]
paragraphs = false
