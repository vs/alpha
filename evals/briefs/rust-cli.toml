- R1: A user can rename every file in a folder to a date-prefixed, lowercase, hyphenated name. Acceptance: given a folder with a file named 'IMG 2041 (3).JPG', when the user runs tidy on it, then the file is renamed to '2026-10-23-img-2041-3.jpg' and nothing else changes.

