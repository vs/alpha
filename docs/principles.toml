[[principles]]
id = "pure-core"
title = "Logic in the middle, side effects at the edges"
statement = "Business logic is kept pure and in the middle; side effects live at the edges."
rationale = "Pure logic is trivial to test and reason about, and isolated side effects are easy to fake or replace."
