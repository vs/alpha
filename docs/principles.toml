[principles.component_params]

[[principles]]
id = "no-dead-code"
title = "No dead code"
statement = "No commented-out code, no speculative options."
rationale = "Unused code still has to be read and maintained, and version control already remembers what was removed."
applies = ["always"]
core = true
checked_by = ["reviewer", "hook:stop_checks"]
active = true
components = ["alpha"]
