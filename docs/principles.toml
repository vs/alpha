[principles.component_params]

[[principles]]
id = "never-weaken-checks"
title = "Never weaken a check to pass it"
statement = "No skipped tests, loosened lint, or catch-all exception handlers, and no mocking the thing under test. A type error from an outdated dependency is fixed by upgrading it, not by removing or downgrading code. If a check is wrong in one place, record why in a decision that names the path and the rule, then make the exception there."
rationale = "A check bent to pass proves nothing; an exception with a recorded reason can be reviewed, and reverted when the reason stops holding."
applies = ["always"]
core = true
checked_by = ["reviewer", "hook:guard_paths"]
active = true
components = ["alpha"]
override_decision = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "stay-in-scope"
title = "Stay in scope"
statement = "No drive-by refactors of code the task doesn't touch."
rationale = "Unrelated changes bloat review and hide the real change in the diff."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["alpha"]
override_decision = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "subtract-first"
title = "Subtract before you add"
statement = "In the code a task touches, first remove what's dead there: unused code, redundant checks, stubs. A new internal API replaces the old one in the same change: every caller migrated, the old one deleted, no compatibility layer."
rationale = "Building on a simpler base keeps the change small, and a compatibility layer kept for now becomes a second API to maintain."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["alpha"]
override_decision = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "smallest-change"
title = "Smallest complete change"
statement = "Take the first option that fully works: skip what nobody asked for, then reuse what the codebase has, then the standard library or platform, then an installed dependency, then one line a reader gets at a glance, and only then new code. No new dependency for a few lines, and no abstraction, wrapper, option, config or \"for later\" code nobody asked for; keep values in the form the platform already gives you, and keep the structure the codebase already has. Never cut validation at trust boundaries, error handling that prevents data loss, security, accessibility, or anything the user asked for."
rationale = "Every line written must be read, tested and fixed later, so the smallest change that fully works is the cheapest to own."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["alpha"]
override_decision = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "scope-first"
title = "Scope before writing"
statement = "Before changing code, list every place the change must reach (callers, tests, fixtures, config, exports) and what it could break for users (data lost or exposed, callers that stop working), then finish every part of it. Features nobody asked for aren't scope."
rationale = "A change that misses a caller or a fixture breaks later, far from the edit."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["alpha"]
override_decision = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "fix-at-the-root"
title = "Fix bugs at the root"
statement = "Before a bug fix, find every caller of the function it touches and fix the root cause once, in the shared code, not in one caller. Code that is moved or merged keeps its error handling and validation."
rationale = "A fix in one caller leaves the others broken, and a move that drops validation is a new bug."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["alpha"]
override_decision = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "lean-structure"
title = "Lean structure"
statement = "Near-copies that must change together are merged into one. A function is split by job, never by line count, and never into helpers that only make it shorter. Between options of equal size, the one that is correct on edge cases wins."
rationale = "Copies drift apart when only one changes, and a split by size adds layers between a question and its answer."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["alpha"]
override_decision = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "never-block-on-the-human"
title = "Never block on the human"
statement = "Don't stop to ask about reversible work. When a requirement is ambiguous, make the reasonable choice, record it in the decision log, and say what you chose. Ask first only when the choice sets product direction or can't be undone: rewriting the main branch, deploys, deleting data, messages to people."
rationale = "The user supervises asynchronously: a recorded, reversible choice costs less than a stalled session, and the record makes it quick to correct."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["alpha"]
override_decision = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "definition-of-done"
title = "Definition of done"
statement = "Tests written and passing, types and lint clean, docs updated, committed per the history principle, reviewer passed."
rationale = "One shared checklist for done keeps completion from being a matter of opinion."
applies = ["always"]
core = true
checked_by = ["reviewer", "hook:stop_checks"]
active = true
components = ["alpha"]
override_decision = ""

