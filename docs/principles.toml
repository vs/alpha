[principles.params]

[principles.component_params]

[[principles]]
id = "code-over-comments"
title = "Code over comments"
statement = "A comment stays only for what the code can't say: a license header, a rule set by a dependency, platform or protocol we can't change, a public API's contract, an issue link for a constraint, or a `shortcut: <the limit>, <when to upgrade>` note on a deliberate shortcut. Anything surprising in our own code is fixed by renaming, extracting or retyping it until it reads plainly, not explained in prose."
rationale = "Comments about our own code drift from it and excuse unclear code; reshaping the code keeps one source of truth that the compiler and tests check."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["alpha"]
override_decision = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "generated-from-source"
title = "Generated files come from their source"
statement = "A generated file changes only by changing its source and regenerating it, never by hand."
rationale = "A hand edit to generated output is lost on the next regeneration, and the source no longer describes what runs."
applies = ["always"]
core = true
checked_by = ["reviewer", "ci:tree"]
active = true
components = ["alpha"]
override_decision = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "contracts"
