# Single source of truth for this project's principles, review thresholds,
# protected paths and component commands. Edit by hand or through alpha skills;
# hooks and reviewers read this file.

schema = 1
kit_version = "0.8.0"

[project]
name = "alpha"
slug = "alpha"

[review]
mode = "at-merge"
max_lines = 200
max_files = 5
exclude = ["**/tests/**", "**/test/**", "docs/**", "**/*.md"]
risk_paths = ["**/migrations/**", "**/*.proto", "**/openapi*.yaml", "**/openapi*.yml", "**/openapi*.json", "**/auth/**", "**/security/**", ".github/**", "docs/principles.toml"]
expected_load = "one developer running alpha on a laptop, against one project at a time"

[protected]
paths = ["**/.env", "**/.env.*", "**/*.pem", "**/*.key", "uv.lock"]
extra = []

[git]
convention = "conventional"
types = ["feat", "fix", "docs", "style", "refactor", "test", "build", "chore", "perf", "ci", "revert"]
scopes = ["alpha", "hooks", "recipes", "defaults", "spec"]
branching = "feature-branches"

[docs_map]
"src/alpha/cli.py" = ["README.md", "CLAUDE.md"]
"bin/**" = ["README.md", "CLAUDE.md"]
"skills/new-project/**" = ["README.md"]
"skills/adopt/**" = ["README.md"]
"skills/extend/**" = ["README.md"]
"skills/go/**" = ["README.md"]

[data]
migration_paths = []
squawk_paths = []

[testing]
diff_coverage = 80
run = "at-merge"

[[components]]
name = "alpha"
path = "."
kind = "cli"
stack = "alpha-python"
manifests = ["pyproject.toml"]
lockfiles = ["uv.lock"]
source_globs = ["**/*.py"]
test_globs = ["tests/**/*.py", "**/test_*.py", "**/*_test.py", "**/conftest.py"]
exclude_globs = ["**/.*/**", "**/__pycache__/**", "**/build/**", "**/dist/**"]

[components.commands]
setup = "uv sync"
format_check = "uv run ruff format --check src tests project-files"
lint = "uv run ruff check src tests project-files"
typecheck = "uv run pyright"
structure = "uv run deptry . --extend-exclude .claude"
test = "uv run pytest"
format = "uv run ruff format src tests project-files"
format_file = "uv run ruff format {file}"
lint_file = "uv run ruff check {file}"

[[components.rules]]
id = "alpha-python:uv-for-dependencies"
rule = "Add and remove dependencies with `uv add` and `uv remove`, never by editing the dependency lists in `pyproject.toml` or with `pip`."

[[components.rules]]
id = "alpha-python:typed-boundaries"
rule = "Parse external input (JSON, files, environment, requests) into dataclasses or typed models at the boundary; don't pass `dict[str, Any]` inward."

[[components.rules]]
id = "alpha-python:import-contracts"
rule = "Once a component has more than one package, add import-linter contracts for the layers `docs/architecture.md` names, and add `lint-imports` to its `structure` command."

[[principles]]
id = "simplest-architecture"
title = "Simplest sufficient architecture"
statement = "As simple as possible, as complex as the problem requires."
rationale = "Every extra layer is a cost paid on each future change, so structure must be earned by a real requirement."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["alpha"]
override_decision = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "fail-helpfully"
title = "Fail fast, fail helpfully"
statement = "Detect errors as early as possible. Every error message describes the problem and tells the user how to proceed."
rationale = "Early detection keeps bugs cheap, and an actionable message saves the reader from guessing the fix."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["alpha"]
override_decision = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "tests-first-class"
title = "Tests are as important as the core"
statement = "Test design and writing get the same effort and intensity as the logic. Tests trace back to acceptance checks. Risky logic (a branch, a parser, money, security, data writes, a bug fix) gets a test that fails when it breaks: one good test, not coverage. A trivial change (a rename, a constant, wiring) may go without one, with the reason recorded."
rationale = "Untrusted tests make every change risky; tying them to acceptance checks keeps them meaningful."
applies = ["always"]
core = true
checked_by = ["reviewer", "hook:stop_checks"]
active = true
components = ["alpha"]
override_decision = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "visual-system"
title = "A deliberate visual system"
statement = "The UI is built from the declared set of visual tools, not ad-hoc styles."
rationale = "A declared set of tokens and components keeps the interface consistent and cheap to change."
applies = ["has_ui"]
core = false
checked_by = ["reviewer"]
active = false
components = []
override_decision = ""

