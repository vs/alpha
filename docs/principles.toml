[[principles]]
id = "validate-at-edges"
title = "Validate at the edges, trust the inside"
statement = "External input is parsed into typed data once, at the boundary. Inside, code doesn't re-check what its own modules return; each remaining cast or runtime check says which boundary or invariant it serves."
rationale = "Parsing once at the boundary means inner code can rely on its types instead of re-checking everywhere, and a check that names its reason can be judged and removed when the reason goes."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["alpha"]
override_decision = ""

[principles.params]

[principles.component_params]

[[principles]]
id = "strict-types"
title = "Strict types"
statement = "TypeScript `strict`, Python type-checked in strict mode."
rationale = "Strict type checking turns whole classes of runtime bugs into immediate, local errors."
applies = ["always"]
core = true
checked_by = ["reviewer", "hook:stop_checks"]
active = true
components = ["alpha"]
