[[principles]]
id = "evidence-before-done"
title = "Evidence before \"done\""
statement = "No claim of success without running the check that shows it."
rationale = "Unverified claims of success are the most common source of broken handoffs."
applies = ["always"]
core = true
checked_by = ["reviewer"]
active = true
components = ["alpha"]
