# Generated by alpha: the repository's weekly checks.
name: "Scheduled"
"on":
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false
permissions:
  contents: "read"
jobs:
  scheduled:
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - uses: "jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d" # v5.2.9
        with:
          install: true
          cache: true
      - name: "mise run scheduled"
        run: "mise run --continue-on-error scheduled"
      - name: "mise run check:toolchain"
        if: "${{ !cancelled() }}"
        run: "mise run check:toolchain"
      - name: "Checks left the tree unchanged"
        run: 'git diff --exit-code && test -z "$(git status --porcelain)"'
