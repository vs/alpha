# typos settings. For a word the kit spells that way on purpose, add it under
# [default.extend-words], e.g. `ser = "ser"`.
[files]
extend-exclude = [
  ".superpowers/",      # git-ignored session scratch
  ".claude/worktrees/", # other sessions' checkouts
  ".venv/",
  # Real tool output on seeded violations (typos among them), for the
  # baseline readers' tests.
  "tests/fixtures/baseline-output/",
  # alpha's: the files git ignores, and the lockfile.
  ".claude/alpha/state/", ".claude/settings.local.json", ".DS_Store", ".claude/alpha/hooks/__pycache__/", ".env", ".env.*", "**/.env", "**/.env.*", "__pycache__/", ".pytest_cache/", "coverage.xml", ".coverage", "uv.lock", "CHANGELOG.md",
]

[default.extend-words]
# Deliberate misspellings and fragments in test data and generated text: the
# tests seed them to prove typos (or the recipe checks) catch them.
teh = "teh"
recieve = "recieve"
comands = "comands"
# `ser` is the example word in the generated _typos.toml header.
ser = "ser"
# A prefix, so a check matches deprecate, deprecated and deprecation.
deprecat = "deprecat"
# The start of b"caf\xe9", an invalid-UTF-8 fixture.
caf = "caf"
# The tool's own name (a monorepo dependency checker).
sherif = "sherif"
